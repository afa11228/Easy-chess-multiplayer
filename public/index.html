<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Easy Chess Multiplayer</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Kalam:wght@700&display=swap" rel="stylesheet">
<script src="/socket.io/socket.io.js"></script>
<script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin:0; min-height:100vh; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:12px; padding:20px;
    font-family:'Caveat', cursive; color:#1e4fa3;
    background:#f6f1e3 radial-gradient(ellipse at center, #fbf7ec 0%, #efe8d4 100%);
  }
  h1 { margin:0; font-size:38px; transform:rotate(-1.5deg); text-align: center; }
  input, button:not(#mic-btn) {
    font-family:'Caveat', cursive; font-size:20px; font-weight:600;
    color:#1e4fa3; background:rgba(255,255,255,0.35);
    border:2px solid #1e4fa3; border-radius:16px 10px 16px 10px;
    padding:8px 18px; margin-top: 10px; text-align: center;
  }
  button:not(#mic-btn) { cursor:pointer; }
  button:not(#mic-btn):hover { background: rgba(30, 79, 163, 0.08); }
  input:read-only { opacity: 0.6; border-style: dashed; cursor: not-allowed; }
  #status { font-size:23px; font-weight:600; min-height:28px; text-align:center; max-width: 320px;}
  
  #game-header {
    display: none; font-size: 22px; font-weight: 700; text-align: center;
    background: rgba(30, 79, 163, 0.1); padding: 8px 16px; 
    border-radius: 10px; border: 2px dashed rgba(30, 79, 163, 0.5);
  }
  #game-header span { color: #d32f2f; }

  /* FLOATING MIC BUTTON */
  #mic-btn {
    display: none; position: fixed; bottom: 20px; right: 20px;
    width: 60px; height: 60px; border-radius: 50%;
    background: rgba(255, 255, 255, 0.9); border: 2px solid #1e4fa3;
    font-size: 28px; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    z-index: 1000; align-items: center; justify-content: center;
    transition: transform 0.1s, background 0.2s;
  }
  #mic-btn:active { transform: scale(0.95); }
  #mic-btn.muted { background: #ffebee; border-color: #c62828; }
  #mic-btn.error { background: #333; border-color: #000; color: white; font-size: 14px; text-align: center; }

  #board {
    display:grid; grid-template-columns:repeat(3, minmax(84px,104px));
    grid-template-rows:repeat(3, minmax(84px,104px));
    background-image:
      linear-gradient(#1e4fa3,#1e4fa3), linear-gradient(#1e4fa3,#1e4fa3),
      linear-gradient(#1e4fa3,#1e4fa3), linear-gradient(#1e4fa3,#1e4fa3);
    background-size:2px 100%,2px 100%,100% 2px,100% 2px;
    background-position:33.333% 0,66.666% 0,0 33.333%,0 66.666%;
    background-repeat:no-repeat; transform:rotate(-0.6deg);
    margin-top: 10px;
  }
  .cell {
    display:flex; align-items:center; justify-content:center;
    font-family:'Kalam', cursive; font-size:clamp(52px,16vw,76px);
    font-weight:700; color:#1e4fa3; cursor:pointer; user-select:none;
    border-radius:10px; text-shadow:0.5px 0.5px 0 rgba(30,79,163,0.18);
  }
  .cell:hover { background:rgba(30,79,163,0.06); }
  .cell.legal { background:rgba(30,79,163,0.12); }
  .cell.selected { outline:2px dashed rgba(30,79,163,0.75); outline-offset:-7px; }
  .cell.win { animation:pen 0.9s ease-in-out infinite; }
  @keyframes pen { 50% { background:rgba(200,60,60,0.20); } }
  
  .panel { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  #rename-area { display: none; flex-direction: column; align-items: center; gap: 10px; margin-top: 10px; }
</style>
</head>
<body>
  <h1>Easy Chess Multiplayer</h1>
  
  <!-- Hidden container for audio tracks -->
  <div id="audio-container" style="display:none;"></div>

  <div id="game-header">
    You: <span id="my-name">...</span> vs Opponent: <span id="opp-name">...</span>
  </div>

  <div id="status">Enter a name to start</div>
  
  <div id="setup-area" class="panel">
    <input type="text" id="username-input" placeholder="Your Username" maxlength="15">
    <button id="find">Find Match</button>
  </div>

  <button id="mic-btn">🔇</button>

  <div id="board"></div>

  <div id="rename-area" class="panel">
    <div id="rename-text" style="font-size: 22px;"></div>
    <input type="text" id="new-name-input" placeholder="New name for loser" maxlength="15">
    <button id="submit-rename">Rename Loser</button>
    <button id="mercy-btn">Show Mercy</button>
  </div>

  <button id="play-again" style="display:none;">Play Again</button>

<script>
const socket = io();
const LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

const boardEl = document.getElementById('board');
const statusEl = document.getElementById('status');
const findBtn = document.getElementById('find');
const setupArea = document.getElementById('setup-area');
const usernameInput = document.getElementById('username-input');
const renameArea = document.getElementById('rename-area');
const renameText = document.getElementById('rename-text');
const newNameInput = document.getElementById('new-name-input');
const submitRenameBtn = document.getElementById('submit-rename');
const mercyBtn = document.getElementById('mercy-btn');
const playAgainBtn = document.getElementById('play-again');
const gameHeader = document.getElementById('game-header');
const myNameEl = document.getElementById('my-name');
const oppNameEl = document.getElementById('opp-name');
const micBtn = document.getElementById('mic-btn');

let roomId = null, mySymbol = null;
let board = Array(9).fill(null), phase = 'placement', turn = 'X';
let selected = null, gameOver = false, winningLine = [];

let livekitRoom = null;
let isMicMuted = true; 

const savedName = localStorage.getItem('myGameUsername');
if (savedName) {
  usernameInput.value = savedName;
  usernameInput.readOnly = true;
  statusEl.textContent = `Welcome back, ${savedName}. Your name is locked.`;
  findBtn.textContent = "Find Match as " + savedName;
}

findBtn.onclick = () => {
  const username = usernameInput.value.trim();
  if (!username) return alert("Please enter a name!");
  localStorage.setItem('myGameUsername', username);
  setupArea.style.display = 'none';
  socket.emit('find-match', username);
  statusEl.textContent = 'Searching for a stranger…';
};

socket.on('waiting', () => {
  statusEl.textContent = 'Waiting for opponent…';
});

socket.on('match-found', ({ roomId: rid, symbol, myName, opponentName, livekitToken }) => {
  roomId = rid; mySymbol = symbol; gameOver = false; selected = null;
  statusEl.textContent = 'Game Started!';
  
  gameHeader.style.display = 'block';
  myNameEl.textContent = myName;
  oppNameEl.textContent = opponentName;
  
  micBtn.style.display = 'flex';
  
  connectVoice(livekitToken);
});

async function connectVoice(token) {
  try {
    const LivekitClient = window.LivekitClient;
    livekitRoom = new LivekitClient.Room();
    
    statusEl.textContent = 'Requesting mic...';
    await navigator.mediaDevices.getUserMedia({ audio: true });
    
    statusEl.textContent = 'Connecting voice...';
    
    // REMOVED the 'relay' restriction so it can connect normally
    await livekitRoom.connect('wss://easy-chess-uamjn03l.livekit.cloud', token);
    
    await livekitRoom.localParticipant.setMicrophoneEnabled(false);
    
    statusEl.textContent = 'Connected! Tap 🎤 to talk.';
    micBtn.textContent = '🔇';
    micBtn.classList.remove('error');
    micBtn.classList.add('muted');

    livekitRoom.on(LivekitClient.RoomEvent.TrackSubscribed, (track, publication, participant) => {
      if (track.kind === 'audio') {
        const audioEl = track.attach();
        audioEl.autoplay = true;
        document.getElementById('audio-container').appendChild(audioEl);
      }
    });

  } catch (err) {
    console.error("Voice connection failed:", err);
    
    // THIS IS THE NEW ERROR MESSAGE
    micBtn.textContent = '❌';
    micBtn.classList.add('error');
    statusEl.textContent = 'Error: ' + err.name + ' - ' + err.message;
  }
}

micBtn.onclick = async () => {
  if (!livekitRoom || micBtn.classList.contains('error')) return;
  
  // Unlock audio playback when tapping the mic
  try {
    await livekitRoom.startAudio();
  } catch (e) {
    console.log("Audio unlock failed", e);
  }

  isMicMuted = !isMicMuted;
  await livekitRoom.localParticipant.setMicrophoneEnabled(!isMicMuted);
  
  if (isMicMuted) {
    micBtn.textContent = '🔇';
    micBtn.classList.add('muted');
  } else {
    micBtn.textContent = '🎤';
    micBtn.classList.remove('muted');
  }
};

function disconnectVoice() {
  if (livekitRoom) {
    livekitRoom.disconnect();
    livekitRoom = null;
  }
  micBtn.style.display = 'none';
}

socket.on('game-state', (state) => {
  board = state.board; phase = state.phase; turn = state.turn;
  selected = null;
  render(); updateStatus();
});

socket.on('game-over', ({ board: b, winner, winnerName, loserName }) => {
  board = b; gameOver = true;
  for (const line of LINES) {
    if (b[line[0]] === winner && b[line[1]] === winner && b[line[2]] === winner) {
      winningLine = line; break;
    }
  }
  render();
  
  if (winner === mySymbol) {
    statusEl.textContent = 'You win!';
    renameArea.style.display = 'flex';
    renameText.textContent = `You beat ${loserName}. Rename them or show mercy:`;
  } else {
    statusEl.textContent = 'You lose. Waiting for winner to decide your fate…';
    playAgainBtn.style.display = 'block';
  }
});

submitRenameBtn.onclick = () => {
  const newName = newNameInput.value.trim();
  if (!newName) return alert("Type a name!");
  const loserSymbol = mySymbol === 'X' ? 'O' : 'X';
  socket.emit('rename-loser', { roomId, newName, loserSymbol });
  renameArea.style.display = 'none';
  statusEl.textContent = `You renamed them to ${newName}!`;
  playAgainBtn.style.display = 'block';
};

mercyBtn.onclick = () => {
  renameArea.style.display = 'none';
  statusEl.textContent = 'You showed mercy.';
  playAgainBtn.style.display = 'block';
};

socket.on('force-rename', (newName) => {
  localStorage.setItem('myGameUsername', newName);
  usernameInput.value = newName;
  statusEl.textContent = `The winner renamed you to: ${newName}!`;
  playAgainBtn.style.display = 'block';
});

playAgainBtn.onclick = () => {
  disconnectVoice();
  window.location.reload();
};

socket.on('opponent-left', () => {
  statusEl.textContent = 'Opponent left.';
  gameOver = true;
  disconnectVoice();
  playAgainBtn.style.display = 'block';
});

function render() {
  boardEl.innerHTML = '';
  for (let i = 0; i < 9; i++) {
    const c = document.createElement('div');
    c.className = 'cell';
    if (board[i]) c.textContent = board[i];
    if (selected === i) c.classList.add('selected');
    if (selected !== null && phase === 'movement' && board[i] === null && !gameOver)
      c.classList.add('legal');
    if (winningLine.includes(i)) c.classList.add('win');
    c.onclick = () => handleClick(i);
    boardEl.appendChild(c);
  }
}

function updateStatus() {
  if (gameOver) return;
  if (turn !== mySymbol) return statusEl.textContent = 'Opponent thinking…';
  statusEl.textContent = phase === 'placement' ? 'Place a piece' : 'Move a piece';
}

function handleClick(i) {
  if (gameOver || turn !== mySymbol) return;
  if (phase === 'placement') {
    if (board[i] !== null) return;
    socket.emit('move', { roomId, to: i });
    return;
  }
  if (selected === null) {
    if (board[i] === mySymbol) { selected = i; render(); }
    return;
  }
  if (i === selected) { selected = null; render(); return; }
  if (board[i] === mySymbol) { selected = i; render(); return; }
  if (board[i] === null) {
    socket.emit('move', { roomId, from: selected, to: i });
  }
}
</script>
</body>
</html>
